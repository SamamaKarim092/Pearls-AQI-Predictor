name: Hourly Air Quality Feature Pipeline

on:
  schedule:
    # Runs at minute 0 of every hour (24 times a day)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI anytime
  push:
    branches:
      - main
    paths:
      - 'src/features/**'
      - '.github/workflows/feature_pipeline.yml'

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Feature Ingestion & Hopsworks Sync
        env:
          PYTHONPATH: .
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME || 'pearls_aqi_predictor' }}
        run: |
          python -m src.features.hopsworks_pipeline
